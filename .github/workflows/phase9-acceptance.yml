name: Phase 9 Acceptance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phase9:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy
      - name: Phase 9 tests
        run: pytest -q tests/test_phase9_metadata_classification.py
      - name: Full Python tests
        run: pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy gov_platform
