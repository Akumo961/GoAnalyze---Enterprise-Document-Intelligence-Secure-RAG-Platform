name: Phase 11 Testing Acceptance

on:
  push:
    branches: [phase11-testing-2026-08]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  phase11:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goanalyze
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: goanalyze
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goanalyze"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Phase 11 security and regression tests
        run: python -m pytest tests/test_phase11_testing.py tests/test_auth.py tests/test_security.py tests/test_tenant_isolation.py tests/test_rate_limit.py tests/test_search.py -v
      - name: Run full test suite
        run: python -m pytest tests/ -v
      - name: Ruff
        run: ruff check gov_platform tests migrations
      - name: mypy
        run: mypy gov_platform --ignore-missing-imports
      - name: Real PostgreSQL migration smoke test
        env:
          GOV_DATABASE_URL: postgresql+asyncpg://goanalyze:ci_test_password@localhost:5432/goanalyze
          GOV_ENVIRONMENT: development
        run: alembic upgrade head
