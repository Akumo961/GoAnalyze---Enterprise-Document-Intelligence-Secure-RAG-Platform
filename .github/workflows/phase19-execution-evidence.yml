name: Phase 19 — Execution Evidence

on:
  push:
    branches: [phase14-government-demo]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  execution-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q gov_platform

      - name: Ruff
        run: ruff check gov_platform tests migrations scripts

      - name: Mypy
        run: mypy gov_platform

      - name: Pytest with coverage gate
        run: pytest --cov=gov_platform --cov-report=term-missing --cov-fail-under=70

      - name: Bandit
        run: bandit -r gov_platform -q

      - name: pip-audit
        run: pip-audit

      - name: API validation
        run: |
          python - <<'PY'
          from gov_platform.main import app
          schema = app.openapi()
          assert isinstance(schema, dict)
          assert schema.get("openapi")
          assert isinstance(schema.get("paths"), dict)
          print(f"OpenAPI validation passed: {len(schema['paths'])} paths")
          PY

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build production container
        run: docker build -f Dockerfile.production -t goanalyze:phase19 .

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: goanalyze:phase19
          format: cyclonedx-json
          output-file: goanalyze-phase19-sbom.json

      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goanalyze:phase19
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Phase acceptance scripts
        run: |
          set -e
          if [ -f demo/run_demo.py ]; then python demo/run_demo.py; fi
          if [ -f demo/verify_phase15.py ]; then python demo/verify_phase15.py; fi
          if [ -f demo/verify_phase16.py ]; then python demo/verify_phase16.py; fi
          if [ -f demo/verify_phase17.py ]; then python demo/verify_phase17.py; fi
          if [ -f demo/verify_phase18.py ]; then python demo/verify_phase18.py; fi

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase19-execution-evidence
          path: |
            goanalyze-phase19-sbom.json
            pytest.xml
          if-no-files-found: ignore
