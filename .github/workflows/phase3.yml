name: Phase 3 Acceptance

on:
  push:
    branches: [phase3-government-workflow-2026-08]
  pull_request:
    paths:
      - 'gov_platform/**'
      - 'tests/**'
      - 'PHASE3_ACCEPTANCE.md'
      - '.github/workflows/phase3.yml'
  workflow_dispatch:

jobs:
  phase3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt pytest ruff mypy
      - name: Phase 3 tests
        run: pytest -q tests/test_phase3_governance.py
      - name: Full Python tests
        run: pytest -q
      - name: Validate Python quality
        run: |
          ruff check gov_platform tests
          mypy gov_platform
