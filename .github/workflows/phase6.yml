name: Phase 6 Acceptance

on:
  push:
    branches: [phase6-api-service-integration-2026-08]
  pull_request:
    paths:
      - 'gov_platform/api.py'
      - 'gov_platform/api_auth.py'
      - 'tests/test_phase6_api.py'
      - 'PHASE6_ACCEPTANCE.md'
      - '.github/workflows/phase6.yml'
      - 'gov_platform/db/**'
  workflow_dispatch:

jobs:
  phase6:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"
      - name: Phase 6 tests
        run: pytest -q tests/test_phase6_api.py
      - name: Full Python tests
        run: pytest -q
      - name: Ruff
        run: ruff check gov_platform tests migrations
      - name: Mypy
        run: mypy gov_platform --ignore-missing-imports
