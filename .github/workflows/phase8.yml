name: Phase 8 Acceptance

on:
  push:
    branches: [phase8-document-processing-2026-08]
  pull_request:
    paths:
      - 'gov_platform/document_processing.py'
      - 'gov_platform/document_processing_api.py'
      - 'gov_platform/api.py'
      - 'gov_platform/document_extract.py'
      - 'tests/test_phase8_processing.py'
      - 'PHASE8_ACCEPTANCE.md'
      - '.github/workflows/phase8.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -e '.[dev,documents]'
      - name: Phase 8 tests
        run: pytest -q tests/test_phase8_processing.py
      - name: Full Python tests
        run: pytest -q
      - name: Ruff
        run: ruff check gov_platform tests migrations
      - name: Mypy
        run: mypy gov_platform --ignore-missing-imports
