name: Phase 10 Acceptance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  phase10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - name: Validate production configuration logic
        run: pytest -q tests/test_phase10_production_config.py
      - name: Run full test suite
        run: pytest -q
      - name: Ruff
        run: ruff check gov_platform tests scripts
      - name: mypy
        run: mypy gov_platform
