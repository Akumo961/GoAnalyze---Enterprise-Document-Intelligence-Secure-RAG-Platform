name: Phase 4 Acceptance

on:
  push:
    branches: [phase4-persistent-government-data-2026-08]
  pull_request:
    paths:
      - 'gov_platform/db/**'
      - 'gov_platform/retention_executor.py'
      - 'migrations/**'
      - 'tests/test_phase4_persistence.py'
      - 'PHASE4_ACCEPTANCE.md'
      - '.github/workflows/phase4.yml'
  workflow_dispatch:

jobs:
  phase4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: python -m pip install -e ".[dev]"
      - name: Phase 4 tests
        run: pytest -q tests/test_phase4_persistence.py
      - name: Full Python tests
        run: pytest -q
      - name: Ruff
        run: ruff check gov_platform tests migrations
      - name: Mypy
        run: mypy gov_platform --ignore-missing-imports
