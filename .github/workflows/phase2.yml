name: Phase 2 Acceptance

on:
  push:
    branches:
      - phase2-rag-2026-08
  pull_request:
    branches:
      - main
      - phase2-rag-2026-08
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit under test
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev,documents]'
      - name: Phase 2 tests
        run: pytest tests/test_phase2_rag_security.py tests/test_phase2_document_extract.py tests/test_phase2_pipeline.py -q
      - name: Phase 2 offline benchmark
        run: python scripts/run_phase2_eval.py
      - name: Validate Python quality
        run: |
          ruff check gov_platform/rag_engine.py gov_platform/document_extract.py gov_platform/ai_security.py gov_platform/rag_index.py gov_platform/phase2_pipeline.py gov_platform/rag_config.py tests/test_phase2_rag_security.py tests/test_phase2_document_extract.py tests/test_phase2_pipeline.py scripts/run_phase2_eval.py
          mypy gov_platform/rag_engine.py gov_platform/document_extract.py gov_platform/ai_security.py gov_platform/rag_index.py gov_platform/phase2_pipeline.py gov_platform/rag_config.py

      # Phase 2 acceptance deliberately validates the exact branch commit.
      # This avoids attributing a stale synthetic PR merge ref to the result.
