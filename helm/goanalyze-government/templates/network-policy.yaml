{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goanalyze-government-api
spec:
  podSelector:
    matchLabels:
      app: goanalyze-government-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowIngressNamespace | quote }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: goanalyze-government
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: redis
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
    - to:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: minio
    - to:
        - namespaceSelector: {}
{{- end }}
