{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goanalyze-government-api
spec:
  podSelector:
    matchLabels:
      app: goanalyze-government-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.allowIngressNamespace | quote }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: goanalyze-government
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS resolution to the cluster DNS service.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Runtime dependencies are expected to be reachable inside the
    # deployment namespace (PostgreSQL, Redis, OpenSearch, S3/MinIO,
    # Kafka/Temporal and the telemetry collector). This deliberately avoids
    # arbitrary cross-namespace pod egress.
    - to:
        - podSelector: {}
{{- end }}
