{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goanalyze-government-frontend
  labels:
    app.kubernetes.io/name: goanalyze-government-frontend
    app.kubernetes.io/part-of: goanalyze-government
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: goanalyze-government-frontend
  template:
    metadata:
      labels:
        app: goanalyze-government-frontend
        app.kubernetes.io/part-of: goanalyze-government
    spec:
      serviceAccountName: {{ include "goanalyze-government.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      containers:
        - name: frontend
          image: {{ .Values.image.frontend }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          securityContext:
{{ toYaml .Values.containerSecurityContext | indent 12 }}
          env:
            - name: NODE_ENV
              value: production
          resources:
{{ toYaml .Values.resources.frontend | indent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: goanalyze-government-frontend
  labels:
    app.kubernetes.io/name: goanalyze-government-frontend
spec:
  type: ClusterIP
  selector:
    app: goanalyze-government-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.servicePort }}
      targetPort: http
{{- end }}
